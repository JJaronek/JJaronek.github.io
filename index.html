<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LP COUNTER</title>
  <style>
    body {
      font-family: system-ui, Arial;
      background: #f8fafc;
      color: #111;
      padding: 2rem;
      max-width: 720px;
      margin: auto;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    .big {
      font-size: 3rem;
      font-weight: 700;
      margin: 1rem 0;
    }
    .meta { color: #555; margin-top: .5rem; font-size: 1rem; }
    button {
      padding: .6rem 1.2rem;
      margin: .3rem;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    input {
      padding: .4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-left: .3rem;
    }
  </style>
</head>
<body>
  <h1>Čas bez nehody</h1>
  <h3>Jako nehoda se počítá mluvení o libovolné "Lesní paní", tj. 0 (E**), 1, 2 (PP) a další, které mohou následovat.</h3>
  <div id="counter" class="big">–</div>
  <div id="since" class="meta">Načítám...</div>

  <div>
    <button id="resetBtn">Resetovat (nehoda teď)</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.min.js"></script>
  <script>
    const gun = Gun({
      peers: ['https://gun-manhattan.herokuapp.com/gun']
    });

    const root = gun.get('safety/counter');
    const passNode = gun.get('safety/admin-pass');
    const counterEl = document.getElementById('counter');
    const sinceEl = document.getElementById('since');
    const resetBtn = document.getElementById('resetBtn');
    const adminPassInput = document.getElementById('adminPass');
    const setPassBtn = document.getElementById('setPassBtn');

    let lastAccident = null;
    let timer = null;

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const parts = [];
      if (days > 0) parts.push(`${days} dn${days===1?'e':'í'}`);
      if (hours > 0 || days > 0) parts.push(`${hours} h`);
      if (minutes > 0 || days > 0 || hours > 0) parts.push(`${minutes} min`);
      parts.push(`${seconds} s`);
      return parts.join(', ');
    }

    function updateDisplay() {
      if (!lastAccident) {
        counterEl.textContent = '—';
        sinceEl.textContent = 'Poslední nehoda: neznámá';
        return;
      }
      const diff = Date.now() - new Date(lastAccident).getTime();
      counterEl.textContent = formatDuration(diff);
      sinceEl.textContent = 'Poslední nehoda: ' + new Date(lastAccident).toLocaleString();
    }

    // Posloucháme změny z GUN
    root.on(data => {
      if (!data || !data.lastAccident) return;
      lastAccident = data.lastAccident;
      updateDisplay();
      if (timer) clearInterval(timer);
      timer = setInterval(updateDisplay, 1000); // aktualizace každou sekundu
    });

    // Pomocné pro heslo
    async function sha256hex(text) {
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    setPassBtn.addEventListener('click', async () => {
      const pass = adminPassInput.value.trim();
      if (!pass) return alert('Zadej heslo.');
      const h = await sha256hex(pass);
      passNode.put({ hash: h }, ack => {
        if (ack.err) alert('Chyba při ukládání hesla: ' + ack.err);
        else alert('Heslo nastaveno.');
      });
    });

    async function checkPass(pass) {
      if(!pass) return false;
      const h = await sha256hex(pass);
      return new Promise(resolve => {
        passNode.once(data => {
          if (!data || !data.hash) resolve(true); // není nastaveno => volný přístup
          else resolve(data.hash === h);
        });
      });
    }

    resetBtn.addEventListener('click', async () => {
      const pass = adminPassInput.value.trim();
      const ok = await checkPass(pass);
      if (!ok) return alert('Špatné heslo.');
      const nowIso = new Date().toISOString();
      root.put({ lastAccident: nowIso }, ack => {
        if (ack.err) alert('Chyba: ' + ack.err);
        else alert('Resetováno na aktuální čas.');
      });
    });
  </script>
</body>
</html>
