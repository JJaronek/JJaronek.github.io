<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LP COUNTER</title>
  <style>
    body {
      font-family: system-ui, Arial;
      background: #f8fafc;
      color: #111;
      padding: 2rem;
      max-width: 720px;
      margin: auto;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    .big { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
    .meta { color: #555; margin-top: .5rem; font-size: 1rem; }
    button {
      padding: .6rem 1.2rem;
      margin: .3rem;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>LP Čas bez nehody</h1>
  <div id="lp-counter" class="big">–</div>
  <div id="lp-since" class="meta">Načítám...</div>
  <button id="lp-reset">Resetovat LP</button>

  <h1>Peťa Čas</h1>
  <div id="peta-counter" class="big">–</div>
  <div id="peta-since" class="meta">Načítám...</div>
  <button id="peta-reset">Resetovat Peťa</button>

  <h1>Bára Zvuky</h1>
  <div id="bara-counter" class="big">0</div>
  <button id="bara-add">+1 Zvuk</button>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.min.js"></script>
  <script>
    const gun = Gun({
      peers: ['https://gun-relay-5uc8.onrender.com/gun']
    });

    // ---- LP Counter ----
    const lpRoot = gun.get('lp/counter');
    const lpCounterEl = document.getElementById('lp-counter');
    const lpSinceEl = document.getElementById('lp-since');
    const lpResetBtn = document.getElementById('lp-reset');
    let lpLast = null, lpTimer = null;

    // ---- Peťa Counter ----
    const petaRoot = gun.get('peta/counter');
    const petaCounterEl = document.getElementById('peta-counter');
    const petaSinceEl = document.getElementById('peta-since');
    const petaResetBtn = document.getElementById('peta-reset');
    let petaLast = null, petaTimer = null;

    // ---- Bára Zvuky Counter ----
    const baraRoot = gun.get('bara/zvuky');
    const baraCounterEl = document.getElementById('bara-counter');
    const baraAddBtn = document.getElementById('bara-add');

    // ----- Pomocné funkce -----
    function formatDuration(ms) {
      const totalSec = Math.floor(ms/1000);
      const days = Math.floor(totalSec/86400);
      const hours = Math.floor((totalSec%86400)/3600);
      const mins = Math.floor((totalSec%3600)/60);
      const secs = totalSec%60;
      const parts = [];
      if(days>0) parts.push(`${days} dn${days===1?'e':'í'}`);
      if(hours>0||days>0) parts.push(`${hours} h`);
      if(mins>0||hours>0||days>0) parts.push(`${mins} min`);
      parts.push(`${secs} s`);
      return parts.join(', ');
    }

    function updateTimeDisplay(elCounter, elSince, lastTime) {
      if(!lastTime) {
        elCounter.textContent = '–';
        elSince.textContent = 'Poslední reset: neznámá';
        return;
      }
      const diff = Date.now() - new Date(lastTime).getTime();
      elCounter.textContent = formatDuration(diff);
      elSince.textContent = 'Poslední reset: ' + new Date(lastTime).toLocaleString();
    }

    // ---- LP Data ----
    lpRoot.on(data=>{
      if(!data || !data.last) return;
      lpLast = data.last;
      updateTimeDisplay(lpCounterEl, lpSinceEl, lpLast);
      if(lpTimer) clearInterval(lpTimer);
      lpTimer = setInterval(()=>updateTimeDisplay(lpCounterEl, lpSinceEl, lpLast),1000);
    });
    lpResetBtn.addEventListener('click', ()=>{
      const now = new Date().toISOString();
      lpRoot.put({last: now});
    });

    // ---- Peťa Data ----
    petaRoot.on(data=>{
      if(!data || !data.last) return;
      petaLast = data.last;
      updateTimeDisplay(petaCounterEl, petaSinceEl, petaLast);
      if(petaTimer) clearInterval(petaTimer);
      petaTimer = setInterval(()=>updateTimeDisplay(petaCounterEl, petaSinceEl, petaLast),1000);
    });
    petaResetBtn.addEventListener('click', ()=>{
      const now = new Date().toISOString();
      petaRoot.put({last: now});
    });

    // ---- Bára Zvuky ----
    baraRoot.on(data=>{
      const val = (data && data.count) || 0;
      baraCounterEl.textContent = val;
    });
    baraAddBtn.addEventListener('click', ()=>{
      baraRoot.once(data=>{
        const val = (data && data.count) || 0;
        baraRoot.put({count: val+1});
      });
    });

  </script>
</body>
</html>
